<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- التدرج الأزرق النيون الساطع لحرف G -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#0011aa" />
    </linearGradient>

    <!-- التدرج الرصاصي الحديدي للقفل (شكل معدني واقعي) -->
    <linearGradient id="metalGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#8a93a5" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#4a5263" />
    </linearGradient>

    <!-- تأثير الشعاع (Glow) المتوهج لحرف G -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <!-- طبقتين من الضبابية لإنشاء توهج قوي وناعم في نفس الوقت -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- ظل للقفل الأمامي لإعطاء عمق وانفصال عن حرف G -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- قناع (Mask) لقص الدائرة وتشكيل حرف G بامتياز -->
    <mask id="g-mask">
      <rect x="0" y="0" width="512" height="512" fill="white" />
      <circle cx="256" cy="256" r="85" fill="black" />
      <!-- قص الربع العلوي الأيمن لإفساح المجال للحديدة ودخولها في الحرف -->
      <rect x="256" y="80" width="256" height="176" fill="black" />
    </mask>

    <!-- قناع لعرض الجزء الأيسر فقط من حديدة القفل وجعله في الأمام -->
    <clipPath id="left-clip">
      <rect x="0" y="0" width="214" height="512" />
    </clipPath>
  </defs>

  <!-- الخلفية السوداء -->
  <rect width="512" height="512" fill="#08080c" rx="100" />

  <!-- حديدة القفل (الخلفية) - القفل مغلق، والجزء الأيمن ينزل خلف حرف G -->
  <path d="M 144,270 V 140 A 70,70 0 0 1 284,140 V 270" fill="none" stroke="url(#metalGrad)" stroke-width="44" stroke-linecap="round" />

  <!-- جسم القفل (حرف G) مع تأثير الشعاع المضيء -->
  <g filter="url(#glow)">
    <!-- الدائرة الأساسية المقطوعة لتكوين جسم الـ G -->
    <circle cx="256" cy="256" r="140" fill="url(#blueGrad)" mask="url(#g-mask)" />
    <!-- الخط الأفقي البارز لحرف G والذي يستقبل الحديدة اليمنى -->
    <path d="M 230,256 H 396 C 404,256 410,262 410,270 V 282 C 410,290 404,296 396,296 H 230 Z" fill="url(#blueGrad)" />
    
    <!-- فتحة المفتاح (نفس لون الخلفية لتبدو كثقب حقيقي داخل الشعاع) -->
    <circle cx="313" cy="272" r="14" fill="#08080c" />
    <path d="M 305,278 L 298,294 H 328 L 321,278 Z" fill="#08080c" />
  </g>

  <!-- حديدة القفل (الأمامية) - تظهر أمام الـ G على اليسار لتعزيز التداخل الثلاثي الأبعاد -->
  <path d="M 144,270 V 140 A 70,70 0 0 1 284,140 V 270" fill="none" stroke="url(#metalGrad)" stroke-width="44" stroke-linecap="round" clip-path="url(#left-clip)" filter="url(#shadow)" />
</svg>
